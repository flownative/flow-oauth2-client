Flownative:
  OAuth2:
    Client:
      garbageCollection:
        # The probability in percent that a request which used an OAuth client
        # removes expired authorizations and states when it ends. Set it to 0
        # and run ./flow oauth:collectgarbage regularly to clean up on a fixed
        # schedule instead.
        #
        # Examples:
        #    1     (a 1 % chance to clean up)
        #   20     (a 20 % chance to clean up)
        #    0.001 (a 0.001 % chance to clean up)
        probability: 1

      services: []
#        - name: 'flownative-beach'
#          className: 'Flownative\Beach\BeachClient'

      token:
        # Lifetime in seconds of tokens which do not specify an expiration
        # time. With null, such tokens are kept until they are removed or
        # replaced.
        defaultLifetime: 600 # 600 seconds = 10 minutes

      encryption:
        # A base64-encoded random key, for example generated with ./flow oauth:generateencryptionkey
        base64EncodedKey: ''
        # AEAD construction to use; currently only "ChaCha20-Poly1305-IETF" is supported
        construction: 'ChaCha20-Poly1305-IETF'

Neos:
  Flow:
    mvc:
      routes:
        Flownative.OAuth2.Client:
          position: 'start'
